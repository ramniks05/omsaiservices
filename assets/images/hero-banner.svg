<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#198754"/>
    </linearGradient>
    <radialGradient id="rad1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rad2" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#grad)"/>

  <!-- Ambient lights -->
  <circle cx="200" cy="160" r="520" fill="url(#rad1)"/>
  <circle cx="1680" cy="120" r="480" fill="url(#rad2)"/>

  <!-- Abstract shapes -->
  <g opacity="0.35" filter="url(#softBlur)">
    <circle cx="1820" cy="-40" r="220" fill="#0d6efd"/>
    <circle cx="-40" cy="1040" r="260" fill="#198754"/>
  </g>

  <!-- Subtle pattern -->
  <g opacity="0.08" fill="#ffffff">
    <path d="M160 820 h160 v8 h-160z"/>
    <path d="M360 820 h160 v8 h-160z"/>
    <path d="M560 820 h160 v8 h-160z"/>
    <path d="M760 820 h160 v8 h-160z"/>
    <path d="M960 820 h160 v8 h-160z"/>
    <path d="M1160 820 h160 v8 h-160z"/>
    <path d="M1360 820 h160 v8 h-160z"/>
    <path d="M1560 820 h160 v8 h-160z"/>
  </g>

  <!-- Iconic marks: shield and broom -->
  <g transform="translate(1420, 740) scale(1.2)" opacity="0.15" fill="#ffffff">
    <path d="M80 0 C100 20 140 24 160 24 C160 140 120 200 80 224 C40 200 0 140 0 24 C20 24 60 20 80 0 Z"/>
  </g>
  <g transform="translate(220, 260) scale(1.1)" opacity="0.14" fill="#ffffff">
    <rect x="0" y="0" width="14" height="280" rx="7"/>
    <rect x="-40" y="240" width="100" height="22" rx="11"/>
    <rect x="-50" y="262" width="120" height="14" rx="7"/>
  </g>

  <!-- Dark vignette for legibility -->
  <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
  </linearGradient>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
